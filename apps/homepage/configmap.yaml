---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
    background:
      image: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
      blur: sm
    theme: dark
    color: slate
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Quick Links:
        - Tomer's Github:
            - abbr: GH
              href: https://github.com/tTomeRr
        - Homelab's Repository:
            - abbr: HL
              href: https://github.com/tTomeRr/homelab
  services.yaml: |
    - Infrastructure:
        - Proxmox:
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/proxmox.svg
            href: https://proxmox.tomerc.com
            description: Proxmox
        - ArgoCD:
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/argo-cd.svg
            href: https://argocd.tomerc.com
            description: ArgoCD
        - AdGuard Home:
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/adguard-home.svg
            href: https://adguard.tomerc.com
            description: Ad Guard Home

    - Applications:
        - qBittorrent:
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/qbittorrent.svg
            href: https://qbittorrent.tomerc.com
            description: qBittorrent
        - Home Assistant:
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/home-assistant.svg
            href: https://homeassistant.tomerc.com
            description: Home Assistant
        - UptimeKuma:
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/uptime-kuma.svg
            href: https://uptimekuma.tomerc.com
            widget:
              type: uptimekuma
              url: http://uptimekuma-service.uptimekuma.svc.cluster.local:3001
              slug: default

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: google
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
