# Done by following the official Doc: https://caddyserver.com/docs/running#manual-installation
# We install Caddy with xcaddy becasue we need the cloudflare module
---
- name: Install Caddy
  block:
    - name: Add system group Caddy
      ansible.builtin.group:
        name: caddy
        state: present
        system: true

    - name: Add dedicated Caddy user
      ansible.builtin.user:
        name: caddy
        shell: /usr/sbin/nologin
        create_home: true
        home: /var/lib/caddy
        group: caddy
        system: true

    - name: Check if caddy binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/caddy
      register: caddy_binary

    - name: Build Caddy with Cloudflare DNS Using xcaddy
      ansible.builtin.command:
        cmd: xcaddy build v{{ caddy_version }} --with github.com/caddy-dns/cloudflare
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/go/bin"
      args:
        chdir: /tmp
      when: not caddy_binary.stat.exists

    - name: Copy Caddy binary to /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/caddy
        dest: /usr/local/bin/caddy
        mode: "0755"
        remote_src: true
      when: not caddy_binary.stat.exists

    - name: Set Caddy binary permissions and ownership
      ansible.builtin.file:
        path: /usr/local/bin/caddy
        mode: "0755"
        owner: caddy
        group: caddy

    - name: Create Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        mode: "0644"
      notify:
        - Restart Caddy

    - name: Create Systemd unit file
      ansible.builtin.template:
        src: service.j2
        dest: /etc/systemd/system/caddy.service
        mode: "0644"

    - name: Start the service unit
      ansible.builtin.systemd_service:
        state: started
        enabled: true
        daemon_reload: true
        name: caddy
