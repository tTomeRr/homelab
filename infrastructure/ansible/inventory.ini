[k3s_cluster:children]
server
agent

[server]
k3s-master ansible_host=192.168.100.110

[agent]
k3s-worker01 ansible_host=192.168.100.111
k3s-worker02 ansible_host=192.168.100.112

[k3s_cluster:vars]
ansible_port=22
ansible_user=ubuntu
k3s_version=v1.31.12+k3s1
; Token generated with `openssl rand -base64 64` command
token={{ lookup('env', 'K3S_TOKEN') }} 
api_endpoint={{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}
