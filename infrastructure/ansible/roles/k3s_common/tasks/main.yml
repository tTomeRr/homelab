---
- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set logging
  community.general.ufw:
    logging: "on"

- community.general.ufw:
    rule: reject
    port: auth
    log: true

- block:
    - name: Reset UFW to installation defaults (deletes all rules)
      community.general.ufw:
        state: reset
    # Prevent VM lock-in in case of failure of one of the tasks.

  always:
    - name: Grant SSH access (port 22)
      community.general.ufw:
        rule: allow
        direction: in
        port: "22"
        proto: tcp

    - name: Enable Api-Server routing
      community.general.ufw:
        rule: allow
        direction: in
        port: "6443"
        proto: tcp

    - name: Allow access for pods and services
      community.general.ufw:
        rule: allow
        src: "{{ item }}"
      loop:
        - 10.42.0.0/16
        - 10.43.0.0/16

    - name: Enable qbittorrent
      community.general.ufw:
        rule: allow
        direction: in
        port: "50413"
        proto: "{{ item }}"
      loop:
        - udp
        - tcp

    - name: Allow outgoing
      community.general.ufw:
        default: allow
        direction: outgoing

    - name: Enable Firewall after rules are set & Deny incoming
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming
