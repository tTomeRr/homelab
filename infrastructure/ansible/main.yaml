---
- name: Init VMs
  hosts: all
  become: true
  roles:
    - system_init
    - monitoring
  tags: init

- name: Configure firewall rules for K3S nodes
  hosts: k3s_cluster
  become: true
  roles:
    - k3s_common
  tags: k3s, security

- name: Deploy K3s cluster
  import_playbook: k3s.orchestration.site
  tags: k3s
